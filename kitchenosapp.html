                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m}:${sec.toString().padStart(2, '0')}`;
            };

            // Logic
            const handleSaveRecipe = () => {
                if (!formData.title.trim()) return;
                if (editingId) {
                    setRecipes(recipes.map(r => r.id === editingId ? { ...r, ...formData } : r));
                    if (selectedRecipe?.id === editingId) setSelectedRecipe({ ...selectedRecipe, ...formData });
                } else {
                    setRecipes([...recipes, { id: Date.now(), ...formData }]);
                }
                setIsFormOpen(false);
            };

            const handleSaveStashEdit = () => {
                if (!editingStashItem.name.trim()) return;
                setStash(stash.map(item => item.id === editingStashItem.id ? editingStashItem : item));
                setEditingStashItem(null);
            };

            const calculateDosage = () => {
                const g = parseFloat(calcData.grams) || 0;
                const p = parseFloat(calcData.thc) || 0;
                const s = parseFloat(calcData.servings) || 1;
                const l = parseFloat(calcData.loss) || 0.88;
                const totalMg = g * 1000 * (p / 100) * l;
                const perServing = totalMg / s;
                setCalcResult({ total: Math.round(totalMg), perServing: Math.round(perServing) });
            };

            const generateShoppingList = () => {
                const newItems = [];
                selectedRecipeIds.forEach(id => {
                    const r = recipes.find(rec => rec.id === id);
                    if (r) {
                        r.ingredients.split(',').forEach(ing => {
                            newItems.push({ id: Date.now() + Math.random(), name: ing.trim(), checked: false });
                        });
                    }
                });
                setShoppingList([...shoppingList, ...newItems]);
                setSelectedRecipeIds([]);
            };

            // Views
            if (selectedRecipe) {
                return (
                    <div className="w-full h-full flex flex-col max-w-md bg-white shadow-2xl animate-in">
                        <div className="flex-none sticky top-0 bg-white/80 backdrop-blur-md p-4 border-b flex items-center gap-4 z-10">
                            <button onClick={() => setSelectedRecipe(null)} className="p-2 hover:bg-slate-100 rounded-full"><ArrowLeft size={24} /></button>
                            <h2 className="font-bold text-lg truncate flex-1">{selectedRecipe.title}</h2>
                            <button onClick={() => { setEditingId(selectedRecipe.id); setFormData(selectedRecipe); setIsFormOpen(true); }} className="p-2 bg-slate-100 rounded-full"><Pencil size={20} /></button>
                        </div>
                        <div className="flex-1 p-6 space-y-8 overflow-y-auto pb-20">
                            <div className="flex gap-4">
                                <div className="flex-1 bg-green-50 p-4 rounded-2xl flex flex-col items-center text-green-700"><Clock size={24} /><span className="font-bold">{selectedRecipe.prepTime}m</span></div>
                                <div className="flex-1 bg-purple-50 p-4 rounded-2xl flex flex-col items-center text-purple-700"><Flame size={24} /><span className="font-bold">{selectedRecipe.cookTime}m</span></div>
                            </div>
                            <div><h3 className="font-bold mb-4 flex gap-2"><Box size={20} /> Matériel & Ingrédients</h3><ul className="space-y-2">{selectedRecipe.ingredients.split(',').map((i, k) => <li key={k} className="bg-slate-50 p-2 rounded-lg text-sm">• {i.trim()}</li>)}</ul></div>
                            <div><h3 className="font-bold mb-4 flex gap-2"><BookOpen size={20} /> Protocole</h3><div className="space-y-4 text-sm text-slate-600 whitespace-pre-line">{selectedRecipe.steps}</div></div>
                        </div>
                        {isFormOpen && (
                            <div className="fixed inset-0 bg-white z-50 flex flex-col p-4 animate-in">
                                <div className="flex justify-between mb-4"><h3 className="font-bold text-xl">Édition Recette</h3><button onClick={() => setIsFormOpen(false)}><X /></button></div>
                                <div className="space-y-4 flex-1 overflow-y-auto">
                                    <Input label="Titre" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} />
                                    <div className="flex gap-2"><Input label="Prépa" type="number" value={formData.prepTime} onChange={e => setFormData({...formData, prepTime: e.target.value})} /><Input label="Cuisson" type="number" value={formData.cookTime} onChange={e => setFormData({...formData, cookTime: e.target.value})} /></div>
                                    <TextArea label="Ingrédients" value={formData.ingredients} onChange={e => setFormData({...formData, ingredients: e.target.value})} />
                                    <TextArea label="Étapes" className="h-32" value={formData.steps} onChange={e => setFormData({...formData, steps: e.target.value})} />
                                </div>
                                <Button onClick={handleSaveRecipe} className="mt-4">Sauvegarder</Button>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="w-full h-full flex flex-col max-w-md bg-white shadow-2xl relative">
                    <header className="flex-none px-6 pt-8 pb-4 sticky top-0 bg-white z-10 flex justify-between items-center">
                        <div className="flex items-center gap-2"><div className="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center"><Leaf size={18} className="text-white"/></div><h1 className="font-bold tracking-tight">KITCHEN<span className="font-light text-green-700">EDIBLE</span></h1></div>
                        {isTimerRunning && activeTab !== 'decarb' && <div onClick={() => setActiveTab('decarb')} className="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-mono font-bold animate-pulse cursor-pointer">{formatTime(timerSeconds)}</div>}
                    </header>

                    <main className="px-6 py-4 flex-1 overflow-y-auto">
                        {activeTab === 'recipes' && (
                            <div className="space-y-4 pb-24">
                                <div className="flex justify-between"><h2 className="text-2xl font-bold">Recettes Infusées</h2><Button onClick={() => {setEditingId(null); setFormData({title:'', prepTime:'', cookTime:'', ingredients:'', steps:''}); setIsFormOpen(true);}} className="rounded-full w-12 h-12 p-0"><Plus /></Button></div>
                                <div className="relative"><Search className="absolute left-4 top-3.5 text-slate-400" size={20}/><input className="w-full pl-12 pr-4 py-3 rounded-xl bg-slate-100 outline-none" placeholder="Rechercher..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div>
                                <div className="space-y-3">
                                    {recipes.filter(r => r.title.toLowerCase().includes(searchTerm.toLowerCase())).map(r => (
                                        <div key={r.id} onClick={() => setSelectedRecipe(r)} className="bg-white p-4 rounded-2xl border flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                            <div><h3 className="font-bold">{r.title}</h3><div className="text-xs text-slate-500 mt-1 flex gap-3"><span>⏱ {r.prepTime}m</span><span>\U0001F4A7 {r.cookTime}m</span></div></div>
                                            <ChevronRight className="text-slate-300" />
                                        </div>
                                    ))}
                                </div>
                                {isFormOpen && (
                                    <div className="fixed inset-0 bg-white z-50 flex flex-col p-4 animate-in">
                                        <div className="flex justify-between mb-4"><h3 className="font-bold text-xl">Nouvelle Recette</h3><button onClick={() => setIsFormOpen(false)}><X /></button></div>
                                        <div className="space-y-4 flex-1 overflow-y-auto">
                                            <Input label="Titre" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} />
                                            <div className="flex gap-2"><Input label="Prépa" type="number" value={formData.prepTime} onChange={e => setFormData({...formData, prepTime: e.target.value})} /><Input label="Cuisson" type="number" value={formData.cookTime} onChange={e => setFormData({...formData, cookTime: e.target.value})} /></div>
                                            <TextArea label="Ingrédients" value={formData.ingredients} onChange={e => setFormData({...formData, ingredients: e.target.value})} />
                                            <TextArea label="Étapes" className="h-32" value={formData.steps} onChange={e => setFormData({...formData, steps: e.target.value})} />
                                        </div>
                                        <Button onClick={handleSaveRecipe} className="mt-4">Enregistrer</Button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'decarb' && (
                            <div className="space-y-6 pb-24">
                                <h2 className="text-2xl font-bold flex gap-2"><Thermometer /> Décarboxylation</h2>
                                <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-xl text-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-20"><Flame size={100} /></div>
                                    <div className="text-7xl font-mono font-bold mb-6 tracking-tighter">{formatTime(timerSeconds)}</div>
                                    <div className="flex gap-4 justify-center mb-6">
                                        <Button onClick={() => setIsTimerRunning(!isTimerRunning)} className={`w-16 h-16 rounded-full ${isTimerRunning ? "bg-orange-500" : "bg-green-600 text-white"}`}>{isTimerRunning ? <Pause size={28} /> : <Play size={28} />}</Button>
                                        <Button onClick={() => {setIsTimerRunning(false); setTimerSeconds(initialTimer);}} className="w-16 h-16 rounded-full bg-slate-700"><RotateCcw size={28} /></Button>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <h3 className="font-bold text-slate-400 uppercase text-xs tracking-wider">Presets</h3>
                                    {PRESETS_DECARB.map((p, i) => (
                                        <div key={i} onClick={() => { setTimerSeconds(p.time * 60); setInitialTimer(p.time * 60); setIsTimerRunning(false); }} className="bg-white p-4 rounded-xl border hover:border-slate-900 cursor-pointer transition-all active:scale-95 flex justify-between items-center">
                                            <div><div className="font-bold">{p.label}</div><div className="text-xs text-slate-500">{p.desc}</div></div>
                                            <div className="text-right"><div className="font-bold text-slate-900">{p.temp}</div><div className="text-xs font-mono bg-slate-100 px-2 py-1 rounded">{p.time} min</div></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'shopping' && (
                            <div className="space-y-4 pb-24">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold flex gap-2"><ShoppingCart /> Provisions</h2><button onClick={() => setShoppingList([])} className="text-xs font-bold text-red-500 bg-red-50 px-3 py-2 rounded-lg">TOUT EFFACER</button></div>
                                
                                {/* SELECTEUR DE RECETTES */}
                                {shoppingList.length === 0 ? (
                                    <div className="bg-white p-6 rounded-2xl border shadow-sm animate-in">
                                        <h3 className="font-bold text-lg mb-4 text-center">Préparer une Session</h3>
                                        <p className="text-sm text-slate-500 text-center mb-6">Sélectionnez les recettes pour générer votre ticket de courses.</p>
                                        <div className="space-y-2 mb-6 max-h-60 overflow-y-auto">
                                            {recipes.map(r => (
                                                <div key={r.id} onClick={() => setSelectedRecipeIds(prev => prev.includes(r.id) ? prev.filter(id => id !== r.id) : [...prev, r.id])} className={`p-3 rounded-xl border flex items-center gap-3 cursor-pointer transition-all ${selectedRecipeIds.includes(r.id) ? 'bg-green-50 border-green-500' : 'bg-slate-50'}`}>
                                                    <div className={`w-5 h-5 rounded flex items-center justify-center border ${selectedRecipeIds.includes(r.id) ? 'bg-green-600 border-green-600' : 'bg-white border-slate-300'}`}>
                                                        {selectedRecipeIds.includes(r.id) && <Check size={14} className="text-white" />}
                                                    </div>
                                                    <span className="font-medium text-sm">{r.title}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <Button onClick={generateShoppingList} className="w-full" disabled={selectedRecipeIds.length === 0}>Générer le Ticket</Button>
                                    </div>
                                ) : (
                                    /* TICKET DE CAISSE */
                                    <div className="animate-in">
                                        <div className="bg-white shadow-xl rounded-none mx-2 mb-6 relative">
                                            {/* Ticket Header */}
                                            <div className="bg-slate-900 text-white p-4 text-center">
                                                <div className="font-mono text-xs uppercase tracking-widest mb-1">KitchenEdible Inc.</div>
                                                <div className="font-bold text-xl">TICKET PROVISIONS</div>
                                                <div className="text-[10px] text-slate-400 mt-1">{new Date().toLocaleDateString()} • {shoppingList.length} ITEMS</div>
                                            </div>
                                            
                                            {/* Ticket Body */}
                                            <div className="p-6 space-y-3 font-mono text-sm bg-white">
                                                {shoppingList.map(item => (
                                                    <div key={item.id} className="flex items-start gap-3 group">
                                                        <div onClick={() => setShoppingList(shoppingList.map(i => i.id === item.id ? {...i, checked: !i.checked} : i))} className="cursor-pointer mt-0.5">
                                                            {item.checked ? <CheckSquare size={18} className="text-slate-400"/> : <Square size={18} className="text-slate-900"/>}
                                                        </div>
                                                        <div className={`flex-1 leading-tight ${item.checked ? 'line-through text-slate-300 decoration-2' : 'text-slate-800'}`}>
                                                            {item.name}
                                                        </div>
                                                        <button onClick={() => setShoppingList(shoppingList.filter(i => i.id !== item.id))} className="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><X size={16}/></button>
                                                    </div>
                                                ))}
                                                
                                                {/* Add Manual Item */}
                                                <div className="border-t border-dashed border-slate-300 pt-4 mt-4 flex gap-2">
                                                    <input className="flex-1 bg-slate-50 p-2 rounded text-sm outline-none font-mono" placeholder="+ Ajouter item..." value={manualItem} onChange={e => setManualItem(e.target.value)} onKeyDown={e => {
                                                        if(e.key === 'Enter' && manualItem) {
                                                            setShoppingList([...shoppingList, {id: Date.now(), name: manualItem, checked: false}]);
                                                            setManualItem('');
                                                        }
                                                    }}/>
                                                    <button onClick={() => {if(manualItem) {setShoppingList([...shoppingList, {id: Date.now(), name: manualItem, checked: false}]); setManualItem('');}}} className="bg-slate-900 text-white px-3 rounded"><Plus size={16}/></button>
                                                </div>
                                            </div>
                                            
                                            {/* Ticket Footer Effect */}
                                            <div className="h-4 w-full ticket-edge absolute -bottom-2 left-0"></div>
                                        </div>
                                        <div className="text-center">
                                            <button onClick={() => setShoppingList([])} className="text-xs text-slate-400 underline">Nouvelle Liste</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'stash' && (
                            <div className="space-y-4 pb-24">
                                <div className="flex justify-between"><h2 className="text-2xl font-bold">Stock</h2><button onClick={() => setStash(stash.filter(i => !i.checked))} className="text-xs font-bold text-red-500 bg-red-50 px-3 py-2 rounded-lg">VIDER COCHÉS</button></div>
                                <div className="bg-white p-4 rounded-xl border space-y-3">
                                    <Input placeholder="Nom (ex: Lemon Haze)..." value={newItemName} onChange={e => setNewItemName(e.target.value)} />
                                    <div className="flex gap-2">
                                        <select value={newItemType} onChange={e => setNewItemType(e.target.value)} className="bg-slate-50 rounded-xl px-4 py-3 outline-none flex-1"><option value="Sativa">Sativa</option><option value="Indica">Indica</option><option value="Hybrid">Hybrid</option></select>
                                        <Input type="number" placeholder="% THC" className="w-24" value={newItemTHC} onChange={e => setNewItemTHC(e.target.value)} />
                                    </div>
                                    <Button onClick={() => {if(newItemName) setStash([...stash, {id:Date.now(), name:newItemName, type:newItemType, thc:newItemTHC, checked:false}]); setNewItemName(''); setNewItemTHC('');}} className="w-full"><Plus /> Ajouter au Stock</Button>
                                </div>
                                <div className="space-y-2">
                                    {stash.map(item => (
                                        <div key={item.id} onClick={() => setStash(stash.map(i => i.id === item.id ? {...i, checked: !i.checked} : i))} className={`flex items-center gap-3 p-4 rounded-xl border transition-all ${item.checked ? 'bg-slate-50 opacity-50' : 'bg-white'}`}>
                                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${item.checked ? 'bg-slate-900 border-slate-900' : 'border-slate-300'}`}>{item.checked && <Check size={14} className="text-white"/>}</div>
                                            <div className="flex-1"><div className={`font-medium ${item.checked ? 'line-through' : ''}`}>{item.name}</div><div className="text-xs flex gap-2 mt-1"><span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${item.type === 'Sativa' ? 'bg-yellow-100 text-yellow-700' : item.type === 'Indica' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'}`}>{item.type}</span>{item.thc && <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">{item.thc}%</span>}</div></div>
                                            <div className="flex gap-2" onClick={e => e.stopPropagation()}><button onClick={() => setEditingStashItem(item)} className="text-slate-300 hover:text-blue-500"><Pencil size={18}/></button><button onClick={() => setStash(stash.filter(i => i.id !== item.id))} className="text-slate-300 hover:text-red-500"><Trash2 size={18}/></button></div>
                                        </div>
                                    ))}
                                    {stash.length === 0 && <div className="text-center text-slate-400 py-8 italic">Le stock est vide... Triste.</div>}
                                </div>
                                {editingStashItem && (
                                    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 animate-in">
                                        <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-xl">Modifier le Stock</h3><button onClick={() => setEditingStashItem(null)}><X /></button></div>
                                            <div className="space-y-4">
                                                <Input label="Nom" value={editingStashItem.name} onChange={e => setEditingStashItem({...editingStashItem, name: e.target.value})} />
                                                <div className="flex gap-2"><div className="flex-1"><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">Type</label><select value={editingStashItem.type} onChange={e => setEditingStashItem({...editingStashItem, type: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-slate-50 outline-none"><option value="Sativa">Sativa</option><option value="Indica">Indica</option><option value="Hybrid">Hybrid</option></select></div><div className="w-24"><Input label="% THC" type="number" value={editingStashItem.thc} onChange={e => setEditingStashItem({...editingStashItem, thc: e.target.value})} /></div></div>
                                                <div className="flex gap-2 mt-4"><Button variant="secondary" onClick={() => setEditingStashItem(null)} className="flex-1">Annuler</Button><Button onClick={handleSaveStashEdit} className="flex-1">Valider</Button></div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'lab' && (
                            <div className="space-y-8 pb-24">
                                <h2 className="text-2xl font-bold flex gap-2"><Flask /> Labo</h2>
                                <div className="bg-white border p-6 rounded-2xl shadow-sm">
                                    <h3 className="font-bold text-slate-900 mb-4 flex gap-2 items-center"><Calculator size={20}/> Calculateur de Puissance</h3>
                                    <div className="space-y-3">
                                        <div className="flex gap-2"><Input label="Fleurs (g)" type="number" placeholder="ex: 5" value={calcData.grams} onChange={e => setCalcData({...calcData, grams: e.target.value})} /><Input label="THC (%)" type="number" placeholder="ex: 15" value={calcData.thc} onChange={e => setCalcData({...calcData, thc: e.target.value})} /></div>
                                        <div className="flex gap-2"><Input label="Portions" type="number" placeholder="ex: 12" value={calcData.servings} onChange={e => setCalcData({...calcData, servings: e.target.value})} /><div className="w-full"><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">Perte Décarb</label><select className="w-full px-4 py-3 rounded-xl bg-slate-50 outline-none" value={calcData.loss} onChange={e => setCalcData({...calcData, loss: e.target.value})}><option value="0.88">Standard (12%)</option><option value="1">Aucune (Théorique)</option><option value="0.75">Élevée (25%)</option></select></div></div>
                                        <Button onClick={calculateDosage} className="w-full mt-2 bg-green-700 hover:bg-green-800">Calculer</Button>
                                    </div>
                                    {calcResult && (<div className="mt-6 bg-slate-900 text-white p-4 rounded-xl text-center animate-in"><div className="text-xs text-slate-400 uppercase tracking-wider mb-1">Par Portion</div><div className="text-4xl font-bold text-green-400 mb-2">{calcResult.perServing} <span className="text-lg text-white">mg</span></div><div className="text-xs text-slate-500 border-t border-slate-700 pt-2 mt-2">Total dans le plat : {calcResult.total} mg</div></div>)}
                                </div>
                                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                    <h3 className="font-bold text-slate-600 mb-4 flex gap-2"><Droplet size={18}/> Guide des Ratios</h3>
                                    <ul className="space-y-3 text-sm text-slate-600"><li className="flex justify-between border-b pb-2"><span>Beurre Fort</span> <span className="font-mono font-bold">1g fleur / 10g beurre</span></li><li className="flex justify-between border-b pb-2"><span>Beurre Moyen</span> <span className="font-mono font-bold">1g fleur / 20g beurre</span></li><li className="flex justify-between border-b pb-2"><span>Huile Coco</span> <span className="font-mono font-bold">1g fleur / 15ml huile</span></li><li className="flex justify-between"><span>Alcool (Tincture)</span> <span className="font-mono font-bold">1g fleur / 20ml alcool</span></li></ul>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="flex-none bg-white border-t px-6 py-4 flex justify-between items-center sticky bottom-0 z-20 pb-8">
                        {['recipes', 'decarb', 'shopping', 'stash', 'lab'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`flex flex-col items-center gap-1 ${activeTab === t ? 'text-slate-900' : 'text-slate-400'}`}>
                                {t === 'recipes' && <Leaf size={24} strokeWidth={activeTab === t ? 2.5 : 2} />}
                                {t === 'decarb' && <Thermometer size={24} strokeWidth={activeTab === t ? 2.5 : 2} />}
                                {t === 'shopping' && <ShoppingCart size={24} strokeWidth={activeTab === t ? 2.5 : 2} />}
                                {t === 'stash' && <Box size={24} strokeWidth={activeTab === t ? 2.5 : 2} />}
                                {t === 'lab' && <Flask size={24} strokeWidth={activeTab === t ? 2.5 : 2} />}
                                <span className="text-[10px] font-bold uppercase">{t === 'recipes' ? 'Recettes' : t === 'decarb' ? 'Décarb' : t === 'shopping' ? 'Courses' : t === 'stash' ? 'Stock' : 'Labo'}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EdibleOS />);
    </script>
</body>
</html>
